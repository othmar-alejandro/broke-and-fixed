  <!-- Footer -->
  <rect y="750" width="1200" height="80" fill="#1E3A5F"/>
  <text x="60" y="799" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#FFFFFF">One project, one honest total under $7,500</text>
