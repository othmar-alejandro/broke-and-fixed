<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --espresso:#0F1F35; --navy:#1E3A5F; --orange:#F07A1A; --orange-soft:#ff9a4d; --cream:#F8F9FC; --slate:#9fb0c6; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ margin:0; background:#0a1322; }
  .sign{ position:relative; width:1200px; height:900px; overflow:hidden;
    background:radial-gradient(130% 130% at 50% -8%, #2b5180 0%, #1E3A5F 30%, #15304f 56%, #0c1a2e 100%);
    font-family:"Inter", system-ui, sans-serif; color:var(--cream); -webkit-font-smoothing:antialiased; isolation:isolate; }
  .sign::after{ content:""; position:absolute; inset:0; box-shadow:inset 0 0 180px 30px rgba(6,14,26,.55); z-index:9; pointer-events:none; }
  .glow{ position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(700px 360px at 50% 6%, rgba(240,122,26,.16), transparent 60%); }

  .inner{ position:relative; z-index:5; height:100%; display:flex; flex-direction:column; padding:40px 56px 0; }
  .top{ display:flex; justify-content:space-between; align-items:center; }
  .brandrow{ display:flex; align-items:center; gap:15px; }
  .shield{ width:78px; height:82px; flex:none; background:url("shield.png") no-repeat center / contain;
    filter:drop-shadow(.7px 0 0 #fff) drop-shadow(-.7px 0 0 #fff) drop-shadow(0 .7px 0 #fff) drop-shadow(0 -.7px 0 #fff) drop-shadow(0 0 8px rgba(255,255,255,.22)); }
  .bn{ font-family:"Barlow Condensed"; font-weight:800; font-size:38px; line-height:.86; letter-spacing:.02em; text-transform:uppercase; color:var(--cream); }
  .bn small{ display:block; font-size:14px; letter-spacing:.4em; color:var(--orange); font-weight:600; margin-top:4px; }
  .bn .amp{ color:var(--orange); }
  .eyebrow{ font-family:"Barlow Condensed"; font-weight:700; font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--slate); }
  .eyebrow b{ color:var(--orange); }

  .hook{ margin-top:18px; font-family:"Barlow Condensed"; font-weight:800; font-size:88px; line-height:.9; letter-spacing:.005em; text-transform:uppercase; color:var(--cream); text-shadow:0 4px 26px rgba(6,14,26,.55); }
  .hook .q{ color:var(--orange); }

  .stage{ position:relative; margin-top:22px; height:454px; border-radius:18px; overflow:hidden; box-shadow:0 28px 64px -26px rgba(0,0,0,.8), 0 0 0 1px rgba(248,249,252,.08); }
  .layer{ position:absolute; inset:0; background-position:center; background-size:cover; }
  .before-img{ background-image:url("photo-before.webp"); filter:saturate(.92) brightness(.92); }
  .after-img{ background-image:url("photo-after.jpg"); clip-path:polygon(55% 0, 100% 0, 100% 100%, 45% 100%); }
  .seam{ position:absolute; inset:0; background:linear-gradient(180deg,var(--orange-soft),var(--orange)); clip-path:polygon(53.6% 0, 55.4% 0, 45.4% 100%, 43.6% 100%); box-shadow:0 0 22px rgba(240,122,26,.5); }
  .tag{ position:absolute; top:0; font-family:"Barlow Condensed"; font-weight:800; font-size:26px; letter-spacing:.2em; text-transform:uppercase; padding:9px 22px; z-index:4; }
  .tag.before{ left:0; background:rgba(8,16,30,.86); color:var(--cream); border-radius:0 0 14px 0; }
  .tag.after{ right:0; background:var(--orange); color:var(--espresso); border-radius:0 0 0 14px; }
  .arrow{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:104px; height:104px; border-radius:50%; background:var(--orange);
    display:flex; align-items:center; justify-content:center; box-shadow:0 14px 36px -8px rgba(0,0,0,.7); z-index:5; border:6px solid var(--espresso); }
  .arrow svg{ width:52px; height:52px; }

  .band{ position:absolute; left:0; right:0; bottom:0; height:182px; background:var(--orange); z-index:7;
    display:flex; align-items:center; justify-content:space-between; padding:0 56px; }
  .bandL .label{ font-family:"Barlow Condensed"; font-weight:800; font-size:34px; letter-spacing:.08em; line-height:1; text-transform:uppercase; color:var(--espresso); }
  .bandL .phone{ font-family:"Barlow Condensed"; font-weight:800; font-size:98px; line-height:.82; letter-spacing:.01em; color:var(--espresso); margin-top:4px; }
  .bandR{ display:flex; align-items:center; gap:18px; flex:none; }
  .bandR .qr{ background:var(--cream); border-radius:13px; padding:11px; }
  .bandR .qr img{ width:130px; height:130px; display:block; }
  .bandR .scan{ font-family:"Barlow Condensed"; font-weight:800; font-size:23px; letter-spacing:.04em; text-transform:uppercase; color:var(--espresso); line-height:1.05; max-width:150px; }
</style>
</head>
<body>
  <div class="sign">
    <div class="glow"></div>
    <div class="inner">
      <div class="top">
        <div class="brandrow">
          <div class="shield" role="img" aria-label="Broke and Fixed shield"></div>
          <div class="bn">Broke <span class="amp">&amp;</span> Fixed<small>HOME SOLUTIONS</small></div>
        </div>
        <div class="eyebrow">Real remodel · <b>Kendall, FL</b></div>
      </div>

      <div class="hook">Still living in the <span class="q">&ldquo;before&rdquo;</span>?</div>

      <div class="stage">
        <div class="layer before-img"></div>
        <div class="layer after-img"></div>
        <div class="seam"></div>
        <span class="tag before">Before</span>
        <span class="tag after">After</span>
        <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#0F1F35" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
      </div>
    </div>

    <div class="band">
      <div class="bandL">
        <div class="label">Free estimate · Call today</div>
        <div class="phone">786 · 363 · 7039</div>
      </div>
      <div class="bandR">
        <div class="qr"><img src="qr.png" alt="Scan to see more projects" /></div>
        <div class="scan">Scan to see more</div>
      </div>
    </div>
  </div>
</body>
</html>
