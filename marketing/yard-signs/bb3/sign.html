<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broke &amp; Fixed Home Solutions Yard Sign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1E3A5F;
    --espresso:#0F1F35;
    --orange:#F07A1A;
    --cream:#F8F9FC;
    --slate:#8FA4BE;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:'Inter',sans-serif;
    background:#0a1525;
  }

  /* ===== THE SIGN: exactly 1200 x 900 ===== */
  .sign{
    position:relative;
    width:1200px;
    height:900px;
    overflow:hidden;
    background:
      /* cinematic off-center key light */
      radial-gradient(120% 95% at 32% 18%,
        #2b537f 0%,
        #1E3A5F 30%,
        #142b47 56%,
        #0F1F35 80%,
        #081424 100%);
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
  }

  /* fine dot-grid texture for depth (subtle) */
  .sign::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
    background-size:26px 26px;
    opacity:.55;
    pointer-events:none;
  }

  /* deep cinematic vignette to push corners back */
  .sign::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(125% 110% at 32% 22%,
      transparent 38%,
      rgba(8,18,32,.30) 70%,
      rgba(6,14,26,.78) 100%);
    pointer-events:none;
  }

  /* soft warm spotlight beam from top-left, behind everything */
  .beam{
    position:absolute;
    top:-340px;
    left:-160px;
    width:1000px;
    height:1000px;
    background:radial-gradient(circle at center,
      rgba(240,122,26,.20) 0%,
      rgba(240,122,26,.09) 32%,
      rgba(240,122,26,0) 62%);
    filter:blur(8px);
    pointer-events:none;
    z-index:1;
  }

  /* orange hairline frame = premium "tiny billboard" containment */
  .frame{
    position:absolute;
    inset:26px;
    border:2px solid rgba(240,122,26,.55);
    border-radius:10px;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.05),
      0 0 36px rgba(240,122,26,.12);
    pointer-events:none;
    z-index:6;
  }
  /* glowing corner ticks */
  .tick{position:absolute;width:30px;height:30px;border:3px solid var(--orange);z-index:7;filter:drop-shadow(0 0 8px rgba(240,122,26,.6));}
  .tick.tl{top:26px;left:26px;border-right:0;border-bottom:0;border-top-left-radius:10px;}
  .tick.tr{top:26px;right:26px;border-left:0;border-bottom:0;border-top-right-radius:10px;}
  .tick.bl{bottom:26px;left:26px;border-right:0;border-top:0;border-bottom-left-radius:10px;}
  .tick.br{bottom:26px;right:26px;border-left:0;border-top:0;border-bottom-right-radius:10px;}

  /* content stack */
  .content{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:72px 78px 70px;
  }

  /* ---- BRAND LOCKUP ---- */
  .brandrow{
    display:flex;
    align-items:center;
    gap:30px;
    margin-top:4px;
  }
  .shieldwrap{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  /* lit glow halo behind the shield */
  .shieldwrap::before{
    content:"";
    position:absolute;
    width:230px;height:230px;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,
      rgba(240,122,26,.42) 0%,
      rgba(240,122,26,.16) 42%,
      rgba(240,122,26,0) 70%);
    z-index:-1;
  }
  .shield{
    width:128px;
    height:auto;
    display:block;
    /* white keyline so navy shield separates from dark bg */
    filter:
      drop-shadow(.8px 0 0 #fff) drop-shadow(-.8px 0 0 #fff)
      drop-shadow(0 .8px 0 #fff) drop-shadow(0 -.8px 0 #fff)
      drop-shadow(0 10px 18px rgba(0,0,0,.55));
  }
  .wordmark{display:flex;flex-direction:column;line-height:.86;}
  .brand-main{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:78px;
    letter-spacing:.5px;
    color:var(--cream);
    text-shadow:0 3px 14px rgba(0,0,0,.45);
  }
  .brand-main .amp{color:var(--orange);}
  .brand-sub{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    font-size:33px;
    letter-spacing:11px;
    color:var(--slate);
    margin-top:8px;
    padding-left:3px;
  }

  /* divider rule with center gem */
  .rule{
    display:flex;align-items:center;justify-content:center;gap:18px;
    width:78%;
    margin:34px 0 30px;
  }
  .rule .line{
    height:2px;flex:1;
    background:linear-gradient(90deg,transparent,rgba(240,122,26,.75),transparent);
  }
  .rule .gem{
    width:13px;height:13px;
    background:var(--orange);
    transform:rotate(45deg);
    box-shadow:0 0 14px rgba(240,122,26,.85);
    flex:0 0 auto;
  }

  /* ---- HEADLINE ---- */
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:7px;
    color:var(--orange);
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .headline{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:74px;
    line-height:.94;
    letter-spacing:1px;
    text-align:center;
    color:var(--cream);
    text-transform:uppercase;
    text-shadow:0 4px 20px rgba(0,0,0,.5);
  }
  .headline b{font-weight:900;color:#ffffff;}

  /* ---- PHONE SLAB (the dominant element) ---- */
  .phonewrap{
    margin-top:auto;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .calllabel{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:6px;
    text-transform:uppercase;
    color:var(--slate);
    margin-bottom:14px;
  }
  .slab{
    position:relative;
    width:100%;
    background:linear-gradient(180deg,#FF8C2A 0%,#F07A1A 52%,#dc6a0e 100%);
    border-radius:16px;
    padding:20px 40px 26px;
    box-shadow:
      0 18px 44px rgba(240,122,26,.34),
      0 3px 0 rgba(255,255,255,.30) inset,
      0 -5px 18px rgba(0,0,0,.18) inset;
    text-align:center;
  }
  .phone{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:900;
    font-size:148px;
    line-height:.84;
    letter-spacing:2px;
    color:var(--espresso);
    text-shadow:0 2px 0 rgba(255,255,255,.22);
    font-variant-numeric:tabular-nums;
  }

  /* ---- FOOTER ---- */
  .footer{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:24px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:23px;
    letter-spacing:1.5px;
    color:var(--cream);
  }
  .footer .dot{color:var(--orange);font-weight:800;}
  .footer .site{color:var(--orange);font-weight:700;}

  /* ---- QR (walk-ups only, small, corner) ---- */
  .qrbox{
    position:absolute;
    right:48px;
    bottom:46px;
    z-index:8;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .qrbox img{
    width:96px;height:96px;
    border-radius:9px;
    padding:7px;
    background:var(--cream);
    box-shadow:0 8px 20px rgba(0,0,0,.45);
    display:block;
  }
  .qrbox span{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--slate);
  }
</style>
</head>
<body>
  <div class="sign">
    <div class="beam"></div>
    <div class="frame"></div>
    <span class="tick tl"></span><span class="tick tr"></span>
    <span class="tick bl"></span><span class="tick br"></span>

    <div class="content">
      <!-- Brand lockup -->
      <div class="brandrow">
        <div class="shieldwrap">
          <img class="shield" src="shield.png" alt="Broke and Fixed Home Solutions shield">
        </div>
        <div class="wordmark">
          <div class="brand-main">BROKE <span class="amp">&amp;</span> FIXED</div>
          <div class="brand-sub">HOME SOLUTIONS</div>
        </div>
      </div>

      <div class="rule">
        <span class="line"></span><span class="gem"></span><span class="line"></span>
      </div>

      <!-- Headline -->
      <div class="eyebrow">Miami-Dade Remodeling</div>
      <div class="headline">NOW <b>REMODELING</b><br>THIS HOME</div>

      <!-- Phone slab (dominant) -->
      <div class="phonewrap">
        <div class="calllabel">Call or Text Today</div>
        <div class="slab">
          <div class="phone">786-363-7039</div>
        </div>
        <div class="footer">
          <span>Family Owned</span><span class="dot">&middot;</span>
          <span>Fully Insured</span><span class="dot">&middot;</span>
          <span class="site">brokeandfixed.com</span>
        </div>
      </div>
    </div>

    <!-- QR for walk-ups -->
    <div class="qrbox">
      <img src="qr.png" alt="QR code to brokeandfixed.com">
      <span>Scan Us</span>
    </div>
  </div>
</body>
</html>
