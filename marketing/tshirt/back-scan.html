<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --espresso:#0F1F35; --navy:#1E3A5F; --orange:#F07A1A; --orange-soft:#ff9a4d;
    --cream:#F8F9FC; --slate:#9fb0c6; --line:rgba(248,249,252,.10);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#0a1322; }

  .shirt{
    position:relative; width:1500px; height:1900px; overflow:hidden;
    background:radial-gradient(135% 115% at 50% -6%, #2b5180 0%, #1E3A5F 26%, #15304f 52%, #0c1a2e 100%);
    font-family:"Inter", system-ui, sans-serif; color:var(--cream);
    -webkit-font-smoothing:antialiased; isolation:isolate;
  }
  .shirt::before{
    content:""; position:absolute; inset:0; z-index:0; opacity:.5;
    background-image:
      linear-gradient(var(--line) 1px,transparent 1px),
      linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:54px 54px;
    -webkit-mask-image:radial-gradient(120% 110% at 50% 46%, #000 58%, transparent 100%);
            mask-image:radial-gradient(120% 110% at 50% 46%, #000 58%, transparent 100%);
  }
  .shirt::after{
    content:""; position:absolute; inset:0; z-index:9; pointer-events:none;
    box-shadow:inset 0 0 220px 40px rgba(6,14,26,.55);
    background:radial-gradient(820px 460px at 50% 48%, rgba(240,122,26,.13), transparent 60%);
  }

  .inner{
    position:relative; z-index:5; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:90px;
  }

  /* ---- compact brand lockup ---- */
  .brandrow{ display:flex; align-items:center; justify-content:center; gap:22px; }
  .shield{
    width:104px; height:110px; flex:none;
    background:url("shield.png") no-repeat center / contain;
    filter:drop-shadow(.8px 0 0 #fff) drop-shadow(-.8px 0 0 #fff)
           drop-shadow(0 .8px 0 #fff) drop-shadow(0 -.8px 0 #fff)
           drop-shadow(0 0 10px rgba(255,255,255,.2));
  }
  .lock{ text-align:left; }
  .lock .wm{
    font-family:"Barlow Condensed"; font-weight:900; font-size:74px; line-height:.82;
    letter-spacing:.01em; text-transform:uppercase; color:var(--cream);
  }
  .lock .wm .amp{ color:var(--orange); }
  .lock .sub{
    font-family:"Barlow Condensed"; font-weight:700; font-size:21px; letter-spacing:.42em;
    text-indent:.42em; text-transform:uppercase; color:var(--orange); margin-top:7px;
  }

  .eyebrow{
    margin-top:54px; font-family:"Barlow Condensed"; font-weight:800; font-size:40px;
    letter-spacing:.2em; text-transform:uppercase; color:var(--slate);
  }
  .eyebrow b{ color:var(--cream); }

  /* ---- QR HERO in a camera viewfinder ---- */
  .scanner{ position:relative; margin-top:40px; width:620px; height:620px; }
  .vf{ position:absolute; width:108px; height:108px; border:9px solid var(--orange); z-index:3; }
  .vf.tl{ top:0; left:0; border-right:0; border-bottom:0; border-radius:14px 0 0 0; }
  .vf.tr{ top:0; right:0; border-left:0; border-bottom:0; border-radius:0 14px 0 0; }
  .vf.bl{ bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 14px; }
  .vf.br{ bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 14px 0; }
  .chip{
    position:absolute; inset:54px; background:var(--cream); border-radius:22px; padding:34px;
    box-shadow:0 30px 70px -24px rgba(0,0,0,.8);
  }
  .chip img{ display:block; width:100%; height:100%; }
  .scanline{
    position:absolute; left:54px; right:54px; top:50%; height:6px; z-index:4;
    background:linear-gradient(90deg, transparent, var(--orange-soft), var(--orange), var(--orange-soft), transparent);
    box-shadow:0 0 26px 4px rgba(240,122,26,.6); border-radius:6px;
  }
  .tab{
    position:absolute; left:50%; top:-34px; transform:translateX(-50%); z-index:5;
    background:var(--orange); color:var(--espresso); white-space:nowrap;
    font-family:"Barlow Condensed"; font-weight:800; font-size:30px; letter-spacing:.1em;
    text-transform:uppercase; padding:10px 26px; border-radius:999px;
    box-shadow:0 14px 30px -12px rgba(0,0,0,.7);
  }

  /* ---- payoff copy ---- */
  .headline{
    margin-top:64px; font-family:"Barlow Condensed"; font-weight:900; font-size:104px; line-height:.9;
    letter-spacing:.005em; text-transform:uppercase; color:var(--cream); text-shadow:0 6px 28px rgba(6,14,26,.5);
  }
  .headline .o{ color:var(--orange); }
  .subcopy{
    margin-top:24px; font-family:"Barlow Condensed"; font-weight:600; font-size:38px;
    letter-spacing:.06em; text-transform:uppercase; color:var(--slate);
  }
  .subcopy .dot{ color:var(--orange); margin:0 .3em; }

  /* ---- footer: call + site ---- */
  .footer{ display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:70px; }
  .calllabel{
    font-family:"Barlow Condensed"; font-weight:800; font-size:34px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--orange);
  }
  .phone{
    font-family:"Barlow Condensed"; font-weight:900; font-size:124px; line-height:.84;
    letter-spacing:.01em; color:var(--cream); text-shadow:0 6px 24px rgba(6,14,26,.5);
  }
  .site{
    margin-top:18px; font-family:"Barlow Condensed"; font-weight:800; font-size:30px;
    letter-spacing:.16em; text-transform:uppercase; color:var(--espresso);
    background:var(--orange); border-radius:8px; padding:8px 20px;
  }
</style>
</head>
<body>
  <div class="shirt">
    <div class="inner">

      <div class="brandrow">
        <div class="shield" role="img" aria-label="Broke and Fixed shield"></div>
        <div class="lock">
          <div class="wm">Broke <span class="amp">&amp;</span> Fixed</div>
          <div class="sub">Home Solutions</div>
        </div>
      </div>

      <div class="eyebrow">Don&rsquo;t take our word for it. <b>See it.</b></div>

      <div class="scanner">
        <span class="tab">Point your camera here</span>
        <span class="vf tl"></span><span class="vf tr"></span>
        <span class="vf bl"></span><span class="vf br"></span>
        <div class="chip"><img src="qr.png" alt="Scan to see Broke and Fixed projects" /></div>
        <span class="scanline"></span>
      </div>

      <div class="headline">See every<br><span class="o">before &amp; after</span></div>
      <div class="subcopy">Photos <span class="dot">&bull;</span> Google reviews <span class="dot">&bull;</span> Free estimate</div>

      <div class="footer">
        <div class="calllabel">Call or text today</div>
        <div class="phone">786 &middot; 363 &middot; 7039</div>
        <div class="site">brokeandfixed.com</div>
      </div>

    </div>
  </div>
</body>
</html>
