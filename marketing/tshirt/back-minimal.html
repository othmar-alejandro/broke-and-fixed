<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{ --orange:#F07A1A; --navy:#1E3A5F; --cream:#F8F9FC; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#0b1220; }

  /* default theme = heather (light shirt, full-colour logo) */
  body{ --shirt:#d9dde2; --ink:#1E3A5F; --accent:#F07A1A; --logo-filter:none; --qrbg:#ffffff; }
  body[data-theme="sand"]   { --shirt:#cabfa6; --ink:#243140; --accent:#C85A12; --logo-filter:none; --qrbg:#ffffff; }
  body[data-theme="white"]  { --shirt:#f1f3f5; --ink:#1E3A5F; --accent:#F07A1A; --logo-filter:none; --qrbg:#ffffff; }
  body[data-theme="navy"]   { --shirt:#1E3A5F; --ink:#F8F9FC; --accent:#FF9A4D; --logo-filter:brightness(0) invert(1); --qrbg:#F8F9FC; }
  body[data-theme="black"]  { --shirt:#16181c; --ink:#F8F9FC; --accent:#FF9A4D; --logo-filter:brightness(0) invert(1); --qrbg:#F8F9FC; }

  .stage{ position:relative; width:1400px; height:1700px; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 14%, #1a2436 0%, #11192a 48%, #0b1220 100%); }

  .tee{ position:absolute; inset:0; z-index:1; }
  .tee svg{ width:100%; height:100%; display:block; }
  .shirt-fill{ fill:var(--shirt); }

  /* the print: logo + QR + one line, sitting high between the shoulder blades */
  .print{ position:absolute; z-index:3; top:470px; left:50%; transform:translateX(-50%);
    width:560px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .qr{ background:#ffffff; border-radius:22px; padding:18px; width:236px; height:236px;
    box-shadow:0 18px 34px -18px rgba(0,0,0,.4); }
  .qr img{ width:100%; height:100%; display:block; }
  .hook{ margin-top:30px; font-family:"Barlow Condensed",sans-serif; font-weight:700;
    font-size:34px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); }
  .logo{ margin-top:54px; width:372px; height:auto; }

  /* colour-way caption (screen only, not part of the print) */
  .cap{ position:absolute; z-index:4; left:0; right:0; bottom:34px; text-align:center;
    font-family:"Inter",sans-serif; font-weight:600; font-size:20px; letter-spacing:.04em; color:#8b97a8; }
</style>
</head>
<body>
  <div class="stage">
    <div class="tee">
      <svg viewBox="0 0 1400 1700" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
            <stop offset=".4" stop-color="#ffffff" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="vig" cx="50%" cy="42%" r="62%">
            <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000000" stop-opacity=".16"/>
          </radialGradient>
          <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="26"/>
          </filter>
          <path id="tee" d="
            M 615 252
            C 560 238, 510 236, 470 250
            C 408 272, 330 298, 286 330
            C 260 348, 246 400, 252 456
            C 256 492, 270 520, 300 528
            C 334 537, 396 512, 434 490
            C 456 478, 456 478, 460 516
            C 470 740, 470 1000, 456 1190
            C 453 1224, 474 1244, 514 1246
            C 642 1268, 758 1268, 886 1246
            C 926 1244, 947 1224, 944 1190
            C 930 1000, 930 740, 940 516
            C 944 478, 944 478, 966 490
            C 1004 512, 1066 537, 1100 528
            C 1130 520, 1144 492, 1148 456
            C 1154 400, 1140 348, 1114 330
            C 1070 298, 992 272, 930 250
            C 890 236, 840 238, 785 252
            C 745 286, 655 286, 615 252 Z"/>
          <clipPath id="teeClip"><use href="#tee"/></clipPath>
        </defs>

        <!-- ground shadow -->
        <ellipse cx="700" cy="1262" rx="318" ry="38" fill="#000" opacity=".22" filter="url(#soft)"/>

        <!-- shirt body -->
        <use href="#tee" class="shirt-fill" stroke="rgba(0,0,0,.10)" stroke-width="2"/>

        <!-- shading -->
        <g clip-path="url(#teeClip)">
          <rect x="0" y="0" width="1400" height="1700" fill="url(#vig)"/>
          <rect x="0" y="230" width="1400" height="520" fill="url(#hi)"/>
          <!-- soft centre crease -->
          <rect x="699" y="320" width="2" height="920" fill="#000" opacity=".05"/>
        </g>

        <!-- back collar rib -->
        <path d="M 615 252 C 655 286, 745 286, 785 252"
              fill="none" stroke="#000" stroke-opacity=".16" stroke-width="20" stroke-linecap="round"/>
        <path d="M 612 246 C 655 280, 745 280, 788 246"
              fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="print">
      <div class="qr"><img src="qr.png" alt="Scan to see our projects" /></div>
      <div class="hook">See our projects</div>
      <img class="logo" src="logo-outline-bold.png" alt="Broke and Fixed Home Solutions" />
    </div>

    <div class="cap" id="cap"></div>
  </div>

  <script>
    var theme = (location.hash || "#heather").slice(1);
    document.body.setAttribute("data-theme", theme);
    var names = { heather:"Heather Gray", sand:"Sand", white:"White", navy:"Shield Navy", black:"Black" };
    document.getElementById("cap").textContent = names[theme] || theme;
  </script>
</body>
</html>
