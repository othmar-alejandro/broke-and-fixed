<html lang="en">
<head>

          <div class="role">Owner</div>
          <span class="name-rule"></span>
        </div>
      </div>
      <div class="tagline">We fix what's broke. We build what's next.</div>
      <div class="front-foot">
        <div class="phone">786 <span>&middot;</span> 363 <span>&middot;</span> 7039</div>
