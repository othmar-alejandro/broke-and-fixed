<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Broke &amp; Fixed Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #1E3A5F;
    --espresso: #0F1F35;
    --orange: #F07A1A;
    --cream: #F8F9FC;
    --slate: #8A99AD;        /* secondary text on dark */
    --slate-dim: #5E6E83;    /* faintest labels */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0a1422; /* neutral so the card edge is visible if ever framed */
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ====================== CARD SHELL ====================== */
  .card {
    position: relative;
    width: 700px;
    height: 400px;
    border-radius: 14px;
    overflow: hidden;
    background:
      radial-gradient(135% 120% at 12% 8%, #234469 0%, #1A3454 38%, #122745 68%, #0F1F35 100%);
    color: var(--cream);
    font-family: "Inter", system-ui, sans-serif;
    isolation: isolate;
  }

  /* Matte material grain. Fine concrete or paper tooth, very low opacity. */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 1;
    opacity: 0.06;
    mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/></filter>\
<rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 160px 160px;
    pointer-events: none;
  }

  /* Soft top sheen to give the dark base depth (tactile, not flat). */
  .sheen {
    position: absolute;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(80% 55% at 78% -10%, rgba(240,122,26,0.10) 0%, rgba(240,122,26,0) 60%),
      linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 22%);
    pointer-events: none;
  }

  /* Precise inner hairline frame. Engineered border, NOT a grid. */
  .frame {
    position: absolute;
    inset: 18px;
    z-index: 4;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 6px;
    pointer-events: none;
  }

  /* ============ STRUCTURAL ORANGE: left spine bar ============ */
  /* A solid, built orange beam down the left edge. The level and ruler spine. */
  .spine {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 14px;
    z-index: 3;
    background: linear-gradient(180deg, #F89A45 0%, var(--orange) 45%, #D9650C 100%);
  }
  /* fine machined tick marks along the spine (ruler edge) */
  .spine::after {
    content: "";
    position: absolute;
    top: 26px; bottom: 26px; right: 0;
    width: 5px;
    background-image: repeating-linear-gradient(
      180deg,
      rgba(15,31,53,0.55) 0px,
      rgba(15,31,53,0.55) 1px,
      rgba(15,31,53,0) 1px,
      rgba(15,31,53,0) 11px
    );
  }
  /* subtle bevel where spine meets the dark face */
  .spine-bevel {
    position: absolute;
    top: 0; bottom: 0; left: 14px;
    width: 3px;
    z-index: 3;
    background: linear-gradient(90deg, rgba(0,0,0,0.35), rgba(0,0,0,0));
  }

  /* ============ STRUCTURAL ORANGE: precise corner bracket ============ */
  /* A machined right-angle bracket in the bottom-right. Craftsman's square. */
  .bracket {
    position: absolute;
    right: 26px; bottom: 26px;
    width: 46px; height: 46px;
    z-index: 4;
    border-right: 3px solid var(--orange);
    border-bottom: 3px solid var(--orange);
    border-bottom-right-radius: 4px;
    pointer-events: none;
  }
  .bracket::before {
    content: "";
    position: absolute;
    right: -3px; bottom: 14px;
    width: 3px; height: 16px;
    background: var(--orange);
    opacity: 0.45;
  }

  /* ====================== LAYOUT ====================== */
  .content {
    position: absolute;
    inset: 0;
    z-index: 5;
    padding: 40px 42px 40px 52px;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---- Top row: logo chip + kicker ---- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .chip {
    width: 84px; height: 84px;
    border-radius: 16px;
    background:
      linear-gradient(160deg, #ffffff 0%, var(--cream) 70%, #E9EDF4 100%);
    box-shadow:
      0 10px 22px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.9),
      inset 0 -2px 4px rgba(30,58,95,0.10);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .chip img {
    width: 70px; height: 70px;
    object-fit: contain;
    display: block;
  }

  .kicker {
    text-align: right;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--slate);
    line-height: 1.5;
  }
  .kicker .dot { color: var(--orange); margin: 0 2px; }

  /* ---- Middle: name / role / tagline ---- */
  .mid { align-self: center; padding-top: 6px; }
  .name {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: 62px;
    line-height: 0.92;
    letter-spacing: 0.005em;
    color: #FFFFFF;
    margin: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.30);
  }
  .role {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--orange);
  }
  .role::before {
    content: "";
    width: 26px; height: 2px;
    background: var(--orange);
    display: inline-block;
  }
  .tagline {
    margin-top: 16px;
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 16.5px;
    line-height: 1.4;
    color: #DCE3EE;
    max-width: 430px;
  }
  .tagline b { color: #FFFFFF; font-weight: 700; }

  /* ---- Bottom: contact, set like a spec sheet ---- */
  .contact {
    display: flex;
    align-items: flex-end;
    gap: 30px;
  }
  .spec {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .spec .lbl {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 10.5px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--slate-dim);
  }
  .spec .val {
    font-family: "Inter", sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 0.01em;
    color: var(--cream);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }
  .phone .val .sep { color: var(--orange); padding: 0 4px; font-weight: 700; }

  /* thin engineered divider between specs (a single rule, not a grid) */
  .divider {
    width: 1px;
    align-self: stretch;
    margin-bottom: 3px;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0) 100%);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grain"></div>
    <div class="sheen"></div>

    <!-- structural orange -->
    <div class="spine"></div>
    <div class="spine-bevel"></div>
    <div class="bracket"></div>

    <div class="frame"></div>

    <div class="content">
      <!-- TOP -->
      <div class="top">
        <div class="chip">
          <img src="logo.png" alt="Broke &amp; Fixed Home Solutions shield" />
        </div>
        <div class="kicker">
          Est. 2023 <span class="dot">·</span> Miami-Dade, FL
        </div>
      </div>

      <!-- MIDDLE -->
      <div class="mid">
        <h1 class="name">Byron Casilla</h1>
        <div class="role">Owner</div>
        <p class="tagline">We fix what's <b>broke</b>. We build what's <b>next</b>.</p>
      </div>

      <!-- BOTTOM -->
      <div class="contact">
        <div class="spec phone">
          <span class="lbl">Call / Text</span>
          <span class="val">786<span class="sep">·</span>363<span class="sep">·</span>7039</span>
        </div>
        <div class="divider"></div>
        <div class="spec">
          <span class="lbl">Online</span>
          <span class="val">brokeandfixed.com</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
