<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{ --espresso:#0F1F35; --navy:#1E3A5F; --orange:#F07A1A; --cream:#F8F9FC; --slate:#8FA0B6; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#0a1322; }
  .card{
    position:relative; width:700px; height:400px; border-radius:14px; overflow:hidden;
    background:radial-gradient(135% 120% at 88% 8%, #25456c 0%, #1E3A5F 30%, #16304f 55%, #0F1F35 100%);
    font-family:"Inter", system-ui, sans-serif; color:var(--cream); -webkit-font-smoothing:antialiased; isolation:isolate;
  }
  .card::before{ content:""; position:absolute; inset:0; background:linear-gradient(105deg, rgba(15,31,53,.55) 0%, rgba(15,31,53,0) 42%, rgba(255,255,255,.05) 100%); z-index:2; pointer-events:none; }
  .card::after{ content:""; position:absolute; inset:0; box-shadow:inset 0 0 80px 8px rgba(7,16,30,.55); border-radius:14px; z-index:6; pointer-events:none; }
  /* subtle orange roofline accent echoing the front */
  .ridge{ position:absolute; left:-30px; top:60px; width:280px; height:2px; background:linear-gradient(90deg, rgba(240,122,26,0), rgba(240,122,26,.5), rgba(240,122,26,0)); transform:rotate(-25deg); transform-origin:left; z-index:1; opacity:.55; }

  .content{ position:absolute; inset:0; z-index:5; padding:32px 38px; display:grid; grid-template-columns:1fr auto; gap:30px; align-items:center; }
  .left{ display:flex; flex-direction:column; gap:18px; }
  .brandrow{ display:flex; align-items:center; gap:13px; }
  .logo-mark{ width:54px; height:57px; flex:none; background:url("shield.png") no-repeat center / contain; filter:drop-shadow(.6px 0 0 #fff) drop-shadow(-.6px 0 0 #fff) drop-shadow(0 .6px 0 #fff) drop-shadow(0 -.6px 0 #fff) drop-shadow(0 0 4px rgba(255,255,255,.18)); }
  .bn{ font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:22px; letter-spacing:.04em; text-transform:uppercase; line-height:.95; color:var(--cream); }
  .bn small{ display:block; font-size:10px; letter-spacing:.34em; color:var(--slate); font-weight:500; margin-top:4px; }
  .bn .amp{ color:var(--orange); }

  .contact{ display:flex; flex-direction:column; gap:10px; }
  .contact .line{ display:flex; align-items:center; gap:11px; font-size:13.5px; font-weight:500; color:var(--cream); }
  .contact .phone{ font-variant-numeric:tabular-nums; letter-spacing:.05em; font-weight:600; }
  .ic{ width:27px; height:27px; border-radius:8px; background:rgba(240,122,26,.14); border:1px solid rgba(240,122,26,.32); display:flex; align-items:center; justify-content:center; flex:none; }
  .ic svg{ width:14px; height:14px; display:block; }

  .services{ display:flex; flex-wrap:wrap; gap:7px; max-width:330px; }
  .chip{ font-family:"Barlow Condensed", sans-serif; font-size:12px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--slate); border:1px solid rgba(143,160,182,.28); border-radius:999px; padding:5px 11px; }

  .right{ display:flex; flex-direction:column; align-items:center; gap:12px; }
  .qr-chip{ background:var(--cream); border-radius:14px; padding:13px; box-shadow:0 16px 36px -14px rgba(0,0,0,.6); }
  .qr-chip img{ width:148px; height:148px; display:block; }
  .scan{ font-family:"Barlow Condensed", sans-serif; text-align:center; font-weight:700; font-size:15px; letter-spacing:.05em; text-transform:uppercase; color:var(--orange); line-height:1.1; }
  .scan small{ display:block; font-family:"Inter", sans-serif; font-weight:500; font-size:10px; letter-spacing:.14em; color:var(--slate); text-transform:none; margin-top:5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="ridge"></div>
    <div class="content">
      <div class="left">
        <div class="brandrow">
          <div class="logo-mark" role="img" aria-label="Broke and Fixed Home Solutions"></div>
          <div class="bn">Broke <span class="amp">&amp;</span> Fixed<small>HOME SOLUTIONS</small></div>
        </div>
        <div class="contact">
          <div class="line"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#F07A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span><span class="phone">786 · 363 · 7039</span></div>
          <div class="line"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#F07A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg></span><span>byron@brokeandfixed.com</span></div>
          <div class="line"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#F07A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.6" cy="6.4" r="1.1" fill="#F07A1A" stroke="none"/></svg></span><span>@brokeandfixed</span></div>
        </div>
        <div class="services">
          <span class="chip">Kitchens</span><span class="chip">Bathrooms</span><span class="chip">Tile</span>
          <span class="chip">Interior Painting</span><span class="chip">Exterior Painting</span><span class="chip">Exterior Repairs</span>
        </div>
      </div>
      <div class="right">
        <div class="qr-chip"><img src="qr.png" alt="Scan to see our projects" /></div>
        <div class="scan">Scan &rarr; See Every Project<small>Photos · Reviews · Free Quote</small></div>
      </div>
    </div>
  </div>
</body>
</html>
