<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Broke &amp; Fixed Card Front</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --espresso:#0F1F35;   /* darkest base */
    --navy:#1E3A5F;        /* shield navy */
    --orange:#F07A1A;      /* trade orange accent */
    --cream:#F8F9FC;       /* primary light text */
    --slate:#8FA0B6;       /* secondary slate gray */
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:#0a1322; }

  /* ---------- CARD SHELL ---------- */
  .card{
    position:relative;
    width:700px;
    height:400px;
    border-radius:14px;
    overflow:hidden;
    /* warm-to-cool dark base: espresso pooling bottom-left, navy lifting top-right */
    background:
      radial-gradient(135% 120% at 88% 8%, #25456c 0%, #1E3A5F 30%, #16304f 55%, #0F1F35 100%);
    font-family:"Inter", system-ui, sans-serif;
    color:var(--cream);
    -webkit-font-smoothing:antialiased;
    isolation:isolate;
  }

  /* soft directional sheen so the "built" side reads brighter than the "broke" side */
  .card::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(105deg, rgba(15,31,53,.55) 0%, rgba(15,31,53,0) 42%, rgba(255,255,255,.05) 100%);
    z-index:2; pointer-events:none;
  }
  /* fine vignette to keep edges premium and contain the composition */
  .card::after{
    content:"";
    position:absolute; inset:0;
    box-shadow:inset 0 0 80px 8px rgba(7,16,30,.55);
    border-radius:14px;
    z-index:6; pointer-events:none;
  }

  /* ---------- THE TRANSFORMATION STAGE (the story) ---------- */
  /* full-bleed SVG: blueprint house (left) resolving into a solid built house (right) */
  .stage{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }
  .stage svg{ width:100%; height:100%; display:block; }

  /* the seam: a single vertical orange light marking broke -> fixed */
  .seam{
    position:absolute;
    top:0; bottom:0;
    left:62%;
    width:1px;
    background:linear-gradient(to bottom, rgba(240,122,26,0) 0%, rgba(240,122,26,.7) 22%, rgba(240,122,26,.9) 50%, rgba(240,122,26,.7) 78%, rgba(240,122,26,0) 100%);
    box-shadow:0 0 14px 1px rgba(240,122,26,.55);
    z-index:3;
  }
  .seam::after{ /* glow halo bleeding from the seam onto the built side */
    content:"";
    position:absolute; top:0; bottom:0; left:0; width:120px;
    background:linear-gradient(to right, rgba(240,122,26,.12), rgba(240,122,26,0));
  }

  /* ---------- CONTENT LAYER ---------- */
  .content{
    position:absolute; inset:0;
    z-index:5;
    padding:38px 40px 34px 40px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
  }

  /* top row: logo chip + kicker */
  .top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
  }
  .brandrow{ display:flex; align-items:center; gap:13px; }
  .logo-mark{
    width:80px; height:85px; flex:none;
    background:url("shield.png") no-repeat center / contain;
    filter:drop-shadow(.7px 0 0 #fff) drop-shadow(-.7px 0 0 #fff) drop-shadow(0 .7px 0 #fff) drop-shadow(0 -.7px 0 #fff) drop-shadow(0 0 4px rgba(255,255,255,.20));
  }
  .bn{ font-family:"Barlow Condensed", sans-serif; font-weight:700; font-size:21px; letter-spacing:.04em; text-transform:uppercase; line-height:.95; color:var(--cream); }
  .bn small{ display:block; font-size:9px; letter-spacing:.3em; color:var(--slate); font-weight:500; margin-top:4px; }
  .bn .amp{ color:var(--orange); }

  .kicker{
    text-align:right;
    font-family:"Barlow Condensed", sans-serif;
    font-weight:500;
    letter-spacing:.22em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--slate);
    line-height:1.5;
    padding-top:6px;
  }
  .kicker .est{ color:var(--orange); font-weight:600; }

  /* mid: the tagline is the hero of the card */
  .hero{
    max-width:600px;
  }
  .eyebrow{
    display:flex; align-items:center; gap:10px;
    margin-bottom:10px;
  }
  .eyebrow .bar{ width:30px; height:2px; background:var(--orange); }
  .eyebrow span{
    font-family:"Barlow Condensed", sans-serif;
    font-weight:600;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--orange);
  }
  .tagline{
    font-family:"Barlow Condensed", sans-serif;
    font-weight:700;
    font-size:42px;
    line-height:.98;
    letter-spacing:.005em;
    margin:0;
    text-transform:uppercase;
    color:var(--cream);
    text-shadow:0 2px 18px rgba(7,16,30,.55);
  }
  .tagline .fixed{
    color:var(--orange);
  }
  .tagline .next{
    color:var(--orange);
  }

  /* bottom: identity + contact rail */
  .foot{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
  }
  .identity .name{
    font-family:"Barlow Condensed", sans-serif;
    font-weight:600;
    font-size:25px;
    letter-spacing:.04em;
    text-transform:uppercase;
    line-height:1;
    color:var(--cream);
  }
  .identity .role{
    font-family:"Inter", sans-serif;
    font-weight:500;
    font-size:12px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--slate);
    margin-top:7px;
  }

  .contact{
    text-align:right;
    display:flex;
    flex-direction:column;
    gap:9px;
    align-items:flex-end;
  }
  .contact .line{
    display:flex; align-items:center; gap:9px;
    font-family:"Inter", sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:var(--cream);
    letter-spacing:.01em;
  }
  .contact .phone{
    font-variant-numeric:tabular-nums;
    letter-spacing:.06em;
    font-weight:600;
  }
  .contact .web{ color:var(--cream); }
  .contact .ic{
    width:26px; height:26px;
    border-radius:7px;
    background:rgba(240,122,26,.14);
    border:1px solid rgba(240,122,26,.32);
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .contact .ic svg{ width:13px; height:13px; display:block; }
  .contact .dot{ color:var(--orange); font-weight:700; }
</style>
</head>
<body>
  <div class="card">

    <!-- THE STORY: blueprint house dissolving into a built, solid house -->
    <div class="stage">
      <svg viewBox="0 0 700 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <!-- fade the blueprint linework in from the left edge -->
          <linearGradient id="blueFade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"  stop-color="#6f86a6" stop-opacity="0.0"/>
            <stop offset="14%" stop-color="#6f86a6" stop-opacity="0.55"/>
            <stop offset="46%" stop-color="#7d96b8" stop-opacity="0.62"/>
            <stop offset="60%" stop-color="#7d96b8" stop-opacity="0.30"/>
            <stop offset="68%" stop-color="#7d96b8" stop-opacity="0.0"/>
          </linearGradient>

          <!-- the solid, finished house fill: emerges on the right of the seam -->
          <linearGradient id="builtFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#2a4d77"/>
            <stop offset="100%" stop-color="#132943"/>
          </linearGradient>
          <linearGradient id="roofFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#33598a"/>
            <stop offset="100%" stop-color="#1d3a5d"/>
          </linearGradient>

          <!-- clip the BUILT (solid) version to only show right of the seam -->
          <clipPath id="builtClip"><rect x="434" y="0" width="266" height="400"/></clipPath>
          <!-- clip the BLUEPRINT (line) version to only show left of the seam -->
          <clipPath id="blueClip"><rect x="0" y="0" width="434" height="400"/></clipPath>
        </defs>

        <!-- ===== BLUEPRINT SIDE (broke / drawn / not yet built) ===== -->
        <g clip-path="url(#blueClip)" stroke="url(#blueFade)" fill="none"
           stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
          <!-- house outline (drawn large, anchored to the right where it will "become" solid) -->
          <path d="M250 300 L250 196 L408 96 L566 196 L566 300"/>
          <!-- roof underline -->
          <path d="M250 196 L408 96 L566 196"/>
          <!-- floor / ground line extending left as a construction reference -->
          <path d="M150 300 L590 300" stroke-width="1.1"/>
          <!-- door -->
          <path d="M380 300 L380 238 L436 238 L436 300"/>
          <!-- windows -->
          <rect x="296" y="232" width="46" height="40" rx="2"/>
          <rect x="474" y="232" width="46" height="40" rx="2"/>
          <!-- faint dimension ticks (architectural, not a grid) -->
          <path d="M250 320 L250 332 M408 320 L408 332 M566 320 L566 332" stroke-width="1" opacity="0.5"/>
          <path d="M250 326 L566 326" stroke-width="0.8" opacity="0.4"/>
          <!-- a couple of thin construction guide lines, sparse -->
          <path d="M408 96 L408 196" stroke-width="0.8" opacity="0.4"/>
        </g>

        <!-- ===== BUILT SIDE (fixed / solid / finished) ===== -->
        <g clip-path="url(#builtClip)">
          <!-- body -->
          <path d="M250 300 L250 196 L408 96 L566 196 L566 300 Z" fill="url(#builtFill)"/>
          <!-- roof slab catches the light -->
          <path d="M250 196 L408 96 L566 196 L408 150 Z" fill="url(#roofFill)"/>
          <!-- ridge highlight (orange edge = the finishing line of light) -->
          <path d="M250 196 L408 96 L566 196" fill="none" stroke="#F07A1A" stroke-width="2" stroke-linejoin="round"/>
          <!-- door, solid -->
          <rect x="380" y="238" width="56" height="62" fill="#0F1F35"/>
          <rect x="380" y="238" width="56" height="62" fill="none" stroke="#F07A1A" stroke-width="1.4" opacity="0.85"/>
          <!-- windows, lit warm -->
          <rect x="296" y="232" width="46" height="40" rx="2" fill="#F07A1A" opacity="0.22"/>
          <rect x="296" y="232" width="46" height="40" rx="2" fill="none" stroke="#F07A1A" stroke-width="1.2" opacity="0.7"/>
          <rect x="474" y="232" width="46" height="40" rx="2" fill="#F07A1A" opacity="0.22"/>
          <rect x="474" y="232" width="46" height="40" rx="2" fill="none" stroke="#F07A1A" stroke-width="1.2" opacity="0.7"/>
          <!-- grounded base line, solid -->
          <path d="M250 300 L590 300" stroke="#2a4d77" stroke-width="3"/>
        </g>
      </svg>
    </div>

    <!-- the orange seam: the exact moment broke becomes fixed -->
    <div class="seam"></div>

    <!-- ===== CONTENT ===== -->
    <div class="content">

      <div class="top">
        <div class="brandrow">
          <div class="logo-mark" role="img" aria-label="Broke and Fixed Home Solutions"></div>
          <div class="bn">Broke <span class="amp">&amp;</span> Fixed<small>HOME SOLUTIONS</small></div>
        </div>
        <div class="kicker">
          <span class="est">Est. 2023</span><br/>
          Miami-Dade, FL
        </div>
      </div>

      <div class="hero">
        <div class="eyebrow"><span>Home Remodeling</span><i class="bar"></i></div>
        <h1 class="tagline">
          We fix what's <span class="fixed">broke</span>.<br/>
          We build what's <span class="next">next</span>.
        </h1>
      </div>

      <div class="foot">
        <div class="identity">
          <div class="name">Othmar Casilla</div>
          <div class="role">Design Specialist</div>
        </div>

        <div class="contact">
          <div class="line">
            <span class="phone">786&nbsp;<span class="dot">·</span>&nbsp;340&nbsp;<span class="dot">·</span>&nbsp;1053</span>
            <span class="ic" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="#F07A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </span>
          </div>
          <div class="line">
            <span class="web">brokeandfixed.com</span>
            <span class="ic" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="#F07A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <path d="M3 12h18"/>
                <path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/>
              </svg>
            </span>
          </div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
